name: Build Muse AI EXE (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller playwright
      - run: pyinstaller --onefile --windowed --name "MuseAI" --add-data "RULES.md;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Muse-AI-EXE
          path: dist/MuseAI.exe
